name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Test
        run: mvn -q test

      - name: Build (skip tests — already ran)
        run: mvn -q -DskipTests package
