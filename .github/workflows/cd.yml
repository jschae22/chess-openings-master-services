name: CD

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  PROJECT_ID: chess-openings-master
  REGION: us-east1
  IMAGE: us-east1-docker.pkg.dev/chess-openings-master/chess-images/backend

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve service name
        id: service
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=chess-opening-master-services" >> $GITHUB_OUTPUT
          else
            echo "name=chess-opening-master-services-staging" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ steps.service.outputs.name }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --set-secrets=DB_URL=NEON_DB_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,JWT_SECRET=JWT_SECRET:latest
