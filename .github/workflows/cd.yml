name: CD

# main deploys to prod. A manual run from any other ref deploys to staging
# (used for integration branches — see cicd-pipeline.md).
on:
  push:
    branches: [main]
    # Docs-only merges don't change what runs in prod, so skip the redeploy.
    paths-ignore:
      - "**.md"
      - ".github/CODEOWNERS"
      - ".github/pull_request_template.md"
  workflow_dispatch:

env:
  PROJECT_ID: chess-openings-master
  REGION: us-east1
  IMAGE: us-east1-docker.pkg.dev/chess-openings-master/chess-images/backend

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Resolve service name
        id: service
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=chess-opening-master-services" >> $GITHUB_OUTPUT
          else
            echo "name=chess-opening-master-services-staging" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ steps.service.outputs.name }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --set-secrets=DB_URL=NEON_DB_URL:latest,CLAUDE_API_KEY=CLAUDE_API_KEY:latest,VOYAGE_API_KEY=VOYAGE_API_KEY:latest,JWT_SECRET=JWT_SECRET:latest

      - name: Smoke test
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          check() {
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$SERVICE_URL$1" || true)
              [ "$code" = "200" ] && echo "OK   $1" && return 0
              echo "wait $1 (attempt $i, HTTP $code)"; sleep 6
            done
            echo "FAIL $1" && return 1
          }
          check /actuator/health
          check /api/openings
