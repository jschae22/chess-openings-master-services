spring:
  application:
    name: chess-openings-master-services
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

claude:
  api-key: ${CLAUDE_API_KEY}
  model: ${CLAUDE_MODEL:claude-haiku-4-5}

voyage:
  api-key: ${VOYAGE_API_KEY}
  model: ${VOYAGE_MODEL:voyage-4-lite}

server:
  port: 8080
